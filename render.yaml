services:
  - type: web
    name: line-sdk-render-repro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: REPLY_TO_LINE
        value: "0"
      - key: REPLY_KEYWORD
        value: "エンジニア"
